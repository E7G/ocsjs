# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Userscript Auto Releases

on:
  workflow_dispatch:
    inputs:
      use_date_version:
        description: 'Generate version based on date?'
        required: true
        default: 'true'
        type: boolean
      version:
        description: 'Release version (only used if "Generate version based on date" is false)'
        required: false
        type: string
      prerelease:
        description: 'Is this a prerelease?'
        required: true
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [lts/*]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup env
        run: |
          echo 'BUILD_PATH="../release"' > ./scripts/.env 
          echo 'VITE_BUILD_PATH="../../release"' > ./packages/core/.env
          echo 'VITE_BUILD_PATH="../../release"' > ./packages/scripts/.env
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV
          
          # Generate version based on user input
          if [ "${{ github.event.inputs.use_date_version }}" = "true" ]; then
            # Generate date-based version
            DATE=$(date +'%Y.%m.%d')
            # Check if a tag with this date already exists
            TAG_SUFFIX=1
            EXISTING_TAGS=$(git tag -l "v${DATE}.*" | sort -V)
            if [ -n "$EXISTING_TAGS" ]; then
              # Get the highest suffix and increment by 1
              LAST_TAG=$(echo "$EXISTING_TAGS" | tail -1)
              LAST_SUFFIX=$(echo "$LAST_TAG" | sed "s/v${DATE}\.//")
              TAG_SUFFIX=$((LAST_SUFFIX + 1))
            fi
            VERSION="${DATE}.${TAG_SUFFIX}"
            echo "Generated date-based version: $VERSION"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            # Use provided version
            VERSION="${{ github.event.inputs.version }}"
            echo "Using provided version: $VERSION"
          else
            # Use package.json version
            VERSION=$(jq -r .version package.json)
            echo "Using package.json version: $VERSION"
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/v${VERSION}/" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_ENV
      - name: Install Dependencies
        run: |
          npm install pnpm -g
          pnpm install -w
          cd packages/scripts
          pnpm install
          cd ../../
          npm run tsc
      - name: Build ocs scripts
        run: npm run build

      - name: Build ChangeLogs
        run: |
          npm run changelog
          npm run changelog:simplify
          npm run changelog:current

      - name: Fetch Change logs
        if: runner.os == 'Linux'
        run: |
          echo "pwd: $(pwd)"
          echo "files:"
          ls -la
          echo "Displaying CHANGELOG_CURRENT.md content:"
          cat CHANGELOG_CURRENT.md
          if [ -f "CHANGELOG_CURRENT.md" ]; then
            CHANGE_LOGS=$(cat CHANGELOG_CURRENT.md)
            echo "CHANGE_LOGS<<EOF" >> $GITHUB_ENV
            echo "$CHANGE_LOGS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "CHANGELOG_CURRENT.md file not found"
          fi
        shell: bash
      - name: Generate release.txt
        if: runner.os == 'Linux'
        run: |
          if [ -z "$CHANGE_LOGS" ]; then
            echo "No change logs found, using default message"
            CHANGE_LOGS="More new features are now supported. Check for detailed changelog soon."
          else
            echo "Using found change logs"
          fi

          cat > release.txt << EOF
          $CHANGE_LOGS

          ## 资源下载列表

          - [用户脚本](${{ env.DOWNLOAD_URL }}ocs.user.js)
          - [用户脚本(全域名通用版)](${{ env.DOWNLOAD_URL }}ocs.common.user.js)
          - [核心库](${{ env.DOWNLOAD_URL }}core.js)
          - [简洁更新日志](${{ env.DOWNLOAD_URL }}CHANGELOG_SIMPLIFIED.md)

          ### 快捷访问
          - [官网](https://docs.ocsjs.com/)

          Created at ${{ env.BUILDTIME }}.
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.VERSION }}
          bodyFile: "./release.txt"
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            ./release/ocs.user.js
            ./release/ocs.common.user.js
            ./release/core.js
            ./release/index.js
            ./CHANGELOG_SIMPLIFIED.md